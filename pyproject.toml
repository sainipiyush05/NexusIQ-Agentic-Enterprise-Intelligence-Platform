[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusiq"
version = "0.1.0"
description = "Enterprise intelligence platform: incremental, measurable implementation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=6.1,<7"]

database = [
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.4,<1",
    "sqlglot>=27,<40",
]
ml = ["scikit-learn>=1.5,<2"]
ml-advanced = [
    "alembic>=1.13,<2",
    "mlflow-skinny>=3,<5",
    "shap>=0.48,<1",
    "sqlalchemy>=2,<3",
]
workflow = [
    "langgraph>=1,<2",
]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "redis>=5.0,<6",
]
dataset = [
    "kagglehub>=1,<2",
]

[project.scripts]
nexusiq = "nexusiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
