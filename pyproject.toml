[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusiq"
version = "0.1.0"
description = "Enterprise intelligence platform: incremental, measurable implementation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=6.1,<7"]

database = ["psycopg[binary]>=3.3,<4", "pgvector>=0.4,<1"]

[project.scripts]
nexusiq = "nexusiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
